[package]
name = "termkata-cli"
version = "0.1.0"
edition = "2021"
description = "termkata CLI 宿主：在终端驱动一轮练习（DeepSeek API；--fake 为开发用假实现）"
license = "GPL-3.0-only"

[[bin]]
name = "termkata"
path = "src/main.rs"

[dependencies]
termkata-core = { path = "../core" }
termkata-host = { path = "../host" }
termkata-wordgen = { path = "../wordgen" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
